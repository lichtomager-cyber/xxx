<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe Telegram WebApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            touch-action: manipulation;
            background: #0f172a;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Neon & Modern Glow Effects */
        .glow-x {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        .glow-o {
            color: #f43f5e;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
        }

        .bg-grid-cell {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bg-grid-cell:active {
            transform: scale(0.95);
        }

        /* Winning Line Animation */
        .cell-winner {
            animation: pulse-win 1s infinite alternate;
            background: rgba(51, 65, 85, 0.9) !important;
        }

        .cell-winner-x {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .cell-winner-o {
            border-color: #f43f5e !important;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
        }

        @keyframes pulse-win {
            0% { transform: scale(0.98); }
            100% { transform: scale(1.03); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 max-w-md mx-auto relative overflow-hidden">

    <!-- App Header / Telegram User Info -->
    <header class="w-full flex justify-between items-center py-2 px-1 border-b border-slate-800">
        <div class="flex items-center gap-2">
            <div id="user-avatar" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-sky-400 text-xs border border-slate-600">
                <i class="fa-solid fa-user"></i>
            </div>
            <div>
                <p id="user-name" class="text-xs font-semibold text-slate-300">Jugador</p>
                <p class="text-[10px] text-slate-500">Telegram WebApp</p>
            </div>
        </div>
        <button id="sound-btn" onclick="toggleSound()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition border border-slate-700">
            <i id="sound-icon" class="fa-solid fa-volume-high text-xs"></i>
        </button>
    </header>

    <!-- Game Title and Turn Indicator -->
    <div class="text-center my-3 w-full">
        <h1 class="text-2xl font-extrabold tracking-wider bg-gradient-to-r from-sky-400 via-indigo-400 to-rose-500 bg-clip-text text-transparent">
            TRES EN RAYA
        </h1>
        
        <!-- Turn Status Badge -->
        <div class="mt-2 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 shadow-lg">
            <span class="text-xs text-slate-400 font-medium">TURNO:</span>
            <span id="turn-display" class="font-bold text-sm glow-x flex items-center gap-1">
                <i class="fa-solid fa-xmark"></i> Jugador X
            </span>
        </div>
    </div>

    <!-- Scoreboard -->
    <div class="grid grid-cols-3 gap-2 w-full mb-3">
        <div class="bg-slate-800/60 border border-sky-500/30 rounded-xl p-2.5 text-center backdrop-blur-sm">
            <p class="text-[10px] uppercase font-bold text-sky-400 tracking-wider">X (Jugador 1)</p>
            <p id="score-x" class="text-2xl font-black text-sky-400">0</p>
        </div>
        <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-2.5 text-center backdrop-blur-sm">
            <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Empates</p>
            <p id="score-draw" class="text-2xl font-black text-slate-200">0</p>
        </div>
        <div class="bg-slate-800/60 border border-rose-500/30 rounded-xl p-2.5 text-center backdrop-blur-sm">
            <p id="o-label" class="text-[10px] uppercase font-bold text-rose-400 tracking-wider">O (Jugador 2)</p>
            <p id="score-o" class="text-2xl font-black text-rose-400">0</p>
        </div>
    </div>

    <!-- Mode Selection Pill -->
    <div class="w-full bg-slate-900/90 p-1 rounded-xl border border-slate-800 flex text-xs mb-3">
        <button id="mode-pvp" onclick="setMode('pvp')" class="flex-1 py-1.5 rounded-lg font-semibold transition-all duration-200 bg-sky-500 text-slate-950 shadow-md">
            <i class="fa-solid fa-users mr-1"></i> 2 Jugadores
        </button>
        <button id="mode-ai-easy" onclick="setMode('ai-easy')" class="flex-1 py-1.5 rounded-lg font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-robot mr-1"></i> IA Fácil
        </button>
        <button id="mode-ai-hard" onclick="setMode('ai-hard')" class="flex-1 py-1.5 rounded-lg font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-brain mr-1"></i> IA Pro
        </button>
    </div>

    <!-- Main Tic-Tac-Toe Grid -->
    <div class="relative w-full aspect-square max-w-[320px] mx-auto my-auto">
        <div id="board" class="grid grid-cols-3 grid-rows-3 gap-2.5 w-full h-full p-2 bg-slate-900/80 rounded-2xl border border-slate-800 shadow-2xl">
            <!-- 9 Cells generated dynamic or fixed -->
            <button class="cell bg-grid-cell rounded-xl text-4xl font-extrabold flex items-center justify-center cursor-pointer" data-index="0"></button>
            <button class="cell bg-grid-cell rounded-xl text-4xl font-extrabold flex items-center justify-center cursor-pointer" data-index="1"></button>
            <button class="cell bg-grid-cell rounded-xl text-4xl font-extrabold flex items-center justify-center cursor-pointer" data-index="2"></button>
            <button class="cell bg-grid-cell rounded-xl text-4xl font-extrabold flex items-center justify-center cursor-pointer" data-index="3"></button>
            <button class="cell bg-grid-cell rounded-xl text-4xl font-extrabold flex items-center justify-center cursor-pointer" data-index="4"></button>
            <button class="cell bg-grid-cell rounded-xl text-4xl font-extrabold flex items-center justify-center cursor-pointer" data-index="5"></button>
            <button class="cell bg-grid-cell rounded-xl text-4xl font-extrabold flex items-center justify-center cursor-pointer" data-index="6"></button>
            <button class="cell bg-grid-cell rounded-xl text-4xl font-extrabold flex items-center justify-center cursor-pointer" data-index="7"></button>
            <button class="cell bg-grid-cell rounded-xl text-4xl font-extrabold flex items-center justify-center cursor-pointer" data-index="8"></button>
        </div>
    </div>

    <!-- Game Controls & Telegram Action -->
    <div class="w-full flex flex-col gap-2 mt-4">
        <div class="flex gap-2">
            <button onclick="resetBoard()" class="flex-1 py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl border border-slate-700 transition flex items-center justify-center gap-2 active:scale-95">
                <i class="fa-solid fa-rotate-right"></i> Reiniciar
            </button>
            <button onclick="clearScores()" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-rose-400 font-bold rounded-xl border border-slate-700 transition flex items-center justify-center active:scale-95" title="Borrar Puntuaciones">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

        <button id="tg-send-btn" onclick="sendResultToTelegram()" class="w-full py-3 px-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-slate-950 font-extrabold rounded-xl shadow-lg shadow-sky-500/20 transition flex items-center justify-center gap-2 active:scale-95">
            <i class="fa-paper-plane fa-solid"></i> Enviar Puntuación a Telegram
        </button>
    </div>

    <script>
        /* Telegram WebApp Initialization */
        const tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand(); // Expand app to full height inside Telegram
            
            // Set App Colors based on Telegram theme
            if (tg.colorScheme === 'light') {
                document.body.classList.add('light-theme');
            }

            // Get user info from Telegram
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
                if (user.username) {
                    document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
                }
            }
        }

        /* Sound Effects Engine (Web Audio API) */
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'x') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now); // A4
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'o') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(330, now); // E4
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'win') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'draw') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(150, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.error("Audio error", e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-xs text-slate-300';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-xs text-rose-400';
            }
            triggerHaptic('impact', 'light');
        }

        /* Haptic Feedback Helper */
        function triggerHaptic(type, style = 'medium') {
            if (tg && tg.HapticFeedback) {
                if (type === 'impact') {
                    tg.HapticFeedback.impactOccurred(style);
                } else if (type === 'notification') {
                    tg.HapticFeedback.notificationOccurred(style); // 'error', 'success', 'warning'
                }
            }
        }

        /* Game State Variables */
        let boardState = Array(9).fill(null);
        let currentPlayer = 'X';
        let gameActive = true;
        let gameMode = 'pvp'; // 'pvp', 'ai-easy', 'ai-hard'
        let scores = { X: 0, O: 0, draw: 0 };

        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        /* DOM Elements */
        const cells = document.querySelectorAll('.cell');
        const turnDisplay = document.getElementById('turn-display');
        const scoreX = document.getElementById('score-x');
        const scoreO = document.getElementById('score-o');
        const scoreDraw = document.getElementById('score-draw');

        /* Initialize Game */
        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        function handleCellClick(e) {
            const cell = e.target;
            const index = parseInt(cell.getAttribute('data-index'));

            if (boardState[index] !== null || !gameActive) return;

            makeMove(index, currentPlayer);

            if (gameActive && gameMode.startsWith('ai') && currentPlayer === 'O') {
                // Lock board briefly for AI move delay
                gameActive = false;
                setTimeout(() => {
                    gameActive = true;
                    let aiIndex;
                    if (gameMode === 'ai-easy') {
                        aiIndex = getRandomFreeCell();
                    } else {
                        aiIndex = getBestMoveMinimax();
                    }
                    if (aiIndex !== null) {
                        makeMove(aiIndex, 'O');
                    }
                }, 400);
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            const cell = cells[index];

            if (player === 'X') {
                cell.innerHTML = '<i class="fa-solid fa-xmark glow-x animate-bounce"></i>';
                playSound('x');
                triggerHaptic('impact', 'light');
            } else {
                cell.innerHTML = '<i class="fa-regular fa-circle glow-o animate-bounce"></i>';
                playSound('o');
                triggerHaptic('impact', 'medium');
            }

            checkResult();

            if (gameActive) {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateTurnDisplay();
            }
        }

        function updateTurnDisplay() {
            if (currentPlayer === 'X') {
                turnDisplay.className = "font-bold text-sm glow-x flex items-center gap-1";
                turnDisplay.innerHTML = '<i class="fa-solid fa-xmark"></i> Jugador X';
            } else {
                turnDisplay.className = "font-bold text-sm glow-o flex items-center gap-1";
                const oName = gameMode.startsWith('ai') ? 'IA Bot' : 'Jugador O';
                turnDisplay.innerHTML = `<i class="fa-regular fa-circle"></i> ${oName}`;
            }
        }

        function checkResult() {
            let roundWon = false;
            let winningCombo = [];

            for (let i = 0; i < winningCombinations.length; i++) {
                const [a, b, c] = winningCombinations[i];
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    roundWon = true;
                    winningCombo = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                gameActive = false;
                scores[currentPlayer]++;
                updateScores();
                highlightWinner(winningCombo);
                playSound('win');
                triggerHaptic('notification', 'success');

                const winnerText = currentPlayer === 'X' ? '¡Gana Jugador X!' : (gameMode.startsWith('ai') ? '¡Gana la IA!' : '¡Gana Jugador O!');
                turnDisplay.className = currentPlayer === 'X' ? 'font-bold text-sm glow-x' : 'font-bold text-sm glow-o';
                turnDisplay.innerText = winnerText;
                return;
            }

            if (!boardState.includes(null)) {
                gameActive = false;
                scores.draw++;
                updateScores();
                playSound('draw');
                triggerHaptic('notification', 'warning');
                turnDisplay.className = 'font-bold text-sm text-slate-400';
                turnDisplay.innerText = '¡Empate!';
            }
        }

        function highlightWinner(combo) {
            combo.forEach(idx => {
                const cell = cells[idx];
                cell.classList.add('cell-winner');
                cell.classList.add(currentPlayer === 'X' ? 'cell-winner-x' : 'cell-winner-o');
            });
        }

        function updateScores() {
            scoreX.innerText = scores.X;
            scoreO.innerText = scores.O;
            scoreDraw.innerText = scores.draw;
        }

        function resetBoard() {
            boardState = Array(9).fill(null);
            gameActive = true;
            currentPlayer = 'X';
            
            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('cell-winner', 'cell-winner-x', 'cell-winner-o');
            });

            updateTurnDisplay();
            triggerHaptic('impact', 'medium');
        }

        function clearScores() {
            scores = { X: 0, O: 0, draw: 0 };
            updateScores();
            resetBoard();
        }

        /* Mode Selection Handler */
        function setMode(mode) {
            gameMode = mode;
            
            const btnPvp = document.getElementById('mode-pvp');
            const btnEasy = document.getElementById('mode-ai-easy');
            const btnHard = document.getElementById('mode-ai-hard');
            const oLabel = document.getElementById('o-label');

            [btnPvp, btnEasy, btnHard].forEach(btn => {
                btn.className = "flex-1 py-1.5 rounded-lg font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200";
            });

            if (mode === 'pvp') {
                btnPvp.className = "flex-1 py-1.5 rounded-lg font-semibold transition-all duration-200 bg-sky-500 text-slate-950 shadow-md";
                oLabel.innerText = "O (Jugador 2)";
            } else if (mode === 'ai-easy') {
                btnEasy.className = "flex-1 py-1.5 rounded-lg font-semibold transition-all duration-200 bg-emerald-500 text-slate-950 shadow-md";
                oLabel.innerText = "O (IA Fácil)";
            } else {
                btnHard.className = "flex-1 py-1.5 rounded-lg font-semibold transition-all duration-200 bg-rose-500 text-slate-950 shadow-md";
                oLabel.innerText = "O (IA Pro)";
            }

            resetBoard();
        }

        /* AI Utilities */
        function getRandomFreeCell() {
            const freeCells = [];
            boardState.forEach((val, idx) => {
                if (val === null) freeCells.push(idx);
            });
            if (freeCells.length === 0) return null;
            return freeCells[Math.floor(Math.random() * freeCells.length)];
        }

        function getBestMoveMinimax() {
            let bestScore = -Infinity;
            let move = null;

            for (let i = 0; i < 9; i++) {
                if (boardState[i] === null) {
                    boardState[i] = 'O';
                    let score = minimax(boardState, 0, false);
                    boardState[i] = null;
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            return move !== null ? move : getRandomFreeCell();
        }

        function minimax(board, depth, isMaximizing) {
            let result = evaluateBoard(board);
            if (result !== null) {
                if (result === 'O') return 10 - depth;
                if (result === 'X') return depth - 10;
                if (result === 'draw') return 0;
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === null) {
                        board[i] = 'O';
                        let score = minimax(board, depth + 1, false);
                        board[i] = null;
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === null) {
                        board[i] = 'X';
                        let score = minimax(board, depth + 1, true);
                        board[i] = null;
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function evaluateBoard(board) {
            for (let i = 0; i < winningCombinations.length; i++) {
                const [a, b, c] = winningCombinations[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            if (!board.includes(null)) return 'draw';
            return null;
        }

        /* Send Result Back to Telegram Bot */
        function sendResultToTelegram() {
            triggerHaptic('impact', 'heavy');
            
            const resultData = {
                game: 'TicTacToe',
                score_X: scores.X,
                score_O: scores.O,
                draws: scores.draw,
                mode: gameMode,
                timestamp: new Date().toISOString()
            };

            if (tg && tg.sendData) {
                tg.sendData(JSON.stringify(resultData));
            } else {
                alert(`[Simulación Telegram sendData]\n\nPuntuación actual:\nVictoras X: ${scores.X}\nVictorias O: ${scores.O}\nEmpates: ${scores.draw}`);
            }
        }
    </script>
</body>
</html>
